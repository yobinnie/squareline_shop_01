<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Mate - 행운을 담은 투두리스트</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero fade-in">
        <div class="container">
            <h1 class="logo">todo mate</h1>
            <p class="tagline">오늘의 할 일을 행운으로 채워보세요.</p>
            <p class="description">
                단순한 체크리스트가 아니에요.<br>
                당신의 소중한 하루가 네잎클로버로 가득 차길 바라는 마음을 담았습니다.
            </p>
            <button class="cta-button">무료로 시작하기</button>
        </div>
    </section>

    <section class="preview fade-in delay-1">
        <div class="todo-card">
            <div class="todo-item">
                <label class="clover-container">
                    <input type="checkbox" checked>
                    <span class="clover-checkmark"></span>
                </label>
                <span class="todo-text">물 2리터 마시기</span>
            </div>
            <div class="todo-item">
                <label class="clover-container">
                    <input type="checkbox">
                    <span class="clover-checkmark"></span>
                </label>
                <span class="todo-text">투두 메이트로 오늘 계획 세우기</span>
            </div>
            <div class="todo-item">
                <label class="clover-container">
                    <input type="checkbox">
                    <span class="clover-checkmark"></span>
                </label>
                <span class="todo-text">일기 쓰며 하루 마무리하기</span>
            </div>
        </div>
    </section>

    <footer class="fade-in delay-2">
        <p>&copy; 2024 Todo Mate. Make your luck today.</p>
    </footer>
</body>
</html>
